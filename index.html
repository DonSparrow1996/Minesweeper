<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width; initial-scale=1" />
	<link rel="stylesheet" href="css/all.css" type="text/css"/>
	<link rel="stylesheet" href="css/fonts.css" type="text/css"/>
	<link rel="icon" href="favicon.ico" type="image/x-icon">
	<script type="text/javascript" src="js/jquery-3.7.1.min.js"></script>
	<script type="text/javascript" src="js/main.js"></script>
	<title>Minesweeper from DonSparrow</title>
</head>

<body>
	<div id="wrapper">
		<div class="layout">
			<section class="title">
				<h1>Minesweeper by DonSparrow</h1>
				<h2>Click any cell to start the game</h2>
			</section>
			<section class="player-area">
				<div class="minefield"></div>
			</section>
			<section class="other">
				<button title="Restart" class="restart_internal" type="button"></button>
				<div class="number"></div>
				<div class="state">
					<p></p>
				</div>
			</section>
			<div class="win">Awesome!</div>
			<button class="restart_external" type="button">New game</button>
		</div>
	</div> 
</body>
</html>
